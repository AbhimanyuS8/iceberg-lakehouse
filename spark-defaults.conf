# Enable Iceberg Spark Extensions
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Configure the 'demo' catalog to use JDBC
spark.sql.catalog.demo                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type            jdbc
spark.sql.catalog.demo.uri             jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.demo.jdbc.user       iceberg
spark.sql.catalog.demo.jdbc.password   iceberg
spark.sql.catalog.demo.warehouse       s3a://warehouse/
spark.sql.catalog.demo.io-impl         org.apache.iceberg.aws.s3.S3FileIO

# Enable View support to silence the JdbcCatalog warning
spark.sql.catalog.demo.jdbc.schema-version   V1

# Force S3FileIO to cleanly close HTTP connections, silencing the stack trace warning
spark.sql.catalog.demo.s3.client-factory     org.apache.iceberg.aws.s3.DefaultS3ClientFactory


# Force Path-Style Access to fix DNS resolution errors
spark.sql.catalog.demo.s3.endpoint     http://minio:9000
spark.sql.catalog.demo.s3.path-style-access true

# Hadoop/S3A FileSystem Credentials & Routing
spark.hadoop.fs.s3a.access.key         admin
spark.hadoop.fs.s3a.secret.key         password
spark.hadoop.fs.s3a.endpoint           http://minio:9000
spark.hadoop.fs.s3a.path.style.access  true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl               org.apache.hadoop.fs.s3a.S3AFileSystem

# Set default catalog to avoid typing 'demo.' before every command
spark.sql.defaultCatalog               demo

# Prevent concurrent Spark sessions from locking the local metastore
spark.sql.catalogImplementation        in-memory

# Enable Spark History and Event Logging
spark.eventLog.enabled                 true
spark.eventLog.dir                     /home/iceberg/spark-events
spark.history.fs.logDirectory          /home/iceberg/spark-events
# Pull missing Hadoop AWS libraries for distributed folder listing (required for remove_orphan_files) and Spark Avro support
spark.jars.packages                    org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.spark:spark-avro_2.12:3.5.0

